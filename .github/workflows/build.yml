name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      resolved-version: ${{ steps.gradle-version.outputs.version }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Extract Project Version
        id: gradle-version
        run: |
          BUILD_FLAGS=""
          if [ "${{ github.event_name }}" = "release" ]; then
            BUILD_FLAGS="-Prelease=true"
          fi
          VERSION=$(./gradlew printVersion $BUILD_FLAGS | grep "^VERSION=" | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: |
          BUILD_FLAGS=""
          if [ "${{ github.event_name }}" = "release" ]; then
            BUILD_FLAGS="-Prelease=true"
          fi
          ./gradlew build $BUILD_FLAGS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
          archive: false

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: build/libs

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/*.jar
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}

      - name: Prepare Description
        id: desc
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "text<<EOF" >> $GITHUB_OUTPUT
            echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
            echo "text=$FIRST_LINE" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Modrinth & Hangar
        uses: HSGamer/action-mcreleaser@main
        with:
          files: build/libs/*.jar
          platforms: modrinth,hangar
        env:
          NAME: ${{ needs.build.outputs.resolved-version }}
          VERSION: ${{ needs.build.outputs.resolved-version }}
          DESCRIPTION: ${{ steps.desc.outputs.text }}
          GAME_VERSIONS: 26.1 26.1.1 26.1.2 26.2
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: Vm3UrNy9
          MODRINTH_LOADERS: paper purpur folia
          MODRINTH_VERSION_TYPE: ${{ github.event_name == 'release' && 'release' || 'alpha' }}
          HANGAR_KEY: ${{ secrets.HANGAR_KEY }}
          HANGAR_PROJECT: vessel
          HANGAR_PLATFORM: PAPER
          HANGAR_CHANNEL: ${{ github.event_name == 'release' && 'Release' || 'Alpha' }}
